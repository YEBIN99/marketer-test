<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나는 어떤 마케터에 어울릴까?</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--text:#1d1d1f;--sub:#6b6b70;--line:#e4e4df;--accent:#5b4bdb;--accent-soft:#eeebff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--text:#f2f2f4;--sub:#a0a0a8;--line:#35353b;--accent:#9d90ff;--accent-soft:#2c2850;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--text:#f2f2f4;--sub:#a0a0a8;--line:#35353b;--accent:#9d90ff;--accent-soft:#2c2850;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px}
h1{font-size:24px;margin:0 0 8px}
.meta{color:var(--sub);font-size:14px;margin:0 0 22px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.q{font-size:18px;font-weight:700;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
.opt b{color:var(--accent);margin-right:8px}
.btn{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px 20px;cursor:pointer;width:100%}
.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);margin-top:10px}
.emoji{font-size:54px;text-align:center}
.rt{font-size:22px;text-align:center;margin:6px 0}
.desc{color:var(--sub);text-align:center;margin:0 0 18px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px}
.tags span{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;font-size:14px;margin:8px 0}
.row span:first-child{width:122px;flex:none}
.row .t{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.row .t i{display:block;height:100%;background:var(--accent)}
.row .n{width:28px;text-align:right;color:var(--sub)}
.hide{display:none}
.rimg{display:block;width:72%;max-width:260px;height:auto;margin:0 auto;background:#fff;border-radius:18px}
.cover{width:100%;height:auto;border-radius:14px;display:block;margin:0 0 14px}
.ig{display:block;text-align:center;text-decoration:none;font-weight:700;color:#fff;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);border-radius:12px;padding:14px;margin-top:6px}
</style>
</head>
